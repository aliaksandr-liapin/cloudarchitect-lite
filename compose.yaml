# CloudArchitect Lite — self-hosted stack (Docker Desktop, Rancher Desktop or Docker Engine).
#
#   docker compose up
#
# Then open the setup link printed by the gateway (http://localhost:8080/setup?code=…).
# To build from source instead: docker compose -f compose.yaml -f compose.build.yaml up --build
# Optional: copy .env.example to .env to preset values; environment variables override the wizard.
services:
  web:
    image: ghcr.io/aliaksandr-liapin/cloudarchitect-lite/web:${CLOUDARCHITECT_VERSION:-0.2.0}
    # Bound to this machine only: the app has no login, so it must not be reachable from the network.
    ports: ['127.0.0.1:${WEB_PORT:-8080}:8080']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_healthy }

  gateway:
    image: ghcr.io/aliaksandr-liapin/cloudarchitect-lite/gateway:${CLOUDARCHITECT_VERSION:-0.2.0}
    # Not published: the web container proxies /api to it.
    env_file:
      - path: .env
        required: false
    environment:
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080},http://localhost:5173
      PUBLIC_URL: http://localhost:${WEB_PORT:-8080}
    volumes: [gateway-data:/data]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

volumes:
  gateway-data:
