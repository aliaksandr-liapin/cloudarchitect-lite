# Build the images from this checkout instead of pulling the published ones (contributors):
#
#   docker compose -f compose.yaml -f compose.build.yaml up --build
services:
  web:
    image: cloudarchitect-web:local
    pull_policy: build
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }

  gateway:
    image: cloudarchitect-gateway:local
    pull_policy: build
    build: { context: ., dockerfile: infra/docker/gateway.Dockerfile }
