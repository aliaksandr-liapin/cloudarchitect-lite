name: Feature request
description: Propose a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Which user need does this address? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: input
    id: prd
    attributes: { label: Related PRD item, description: 'e.g. FR-016, NFR-009, ROADMAP E4' }
