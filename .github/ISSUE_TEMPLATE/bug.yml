name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include steps to reproduce. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What did you expect }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit }
  - type: markdown
    attributes:
      value: Do not paste API keys or private architecture details. Report security issues per SECURITY.md.
