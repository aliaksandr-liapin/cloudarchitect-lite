name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node tools/check-versions.ts

  eval:
    name: AI evaluation harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: eval/results/

  containers:
    name: Build and scan images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        image: [web, gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          tags: cloudarchitect-${{ matrix.image }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan image (fail on fixable critical vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cloudarchitect-${{ matrix.image }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  install-smoke:
    name: Install smoke test (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fresh install as documented (no .env)
        run: docker compose -f compose.yaml -f compose.build.yaml up --build --detach --wait --wait-timeout 300
      - name: Setup link is printed and the API answers through nginx
        run: |
          # Bodies are captured first: `curl | grep -q` can fail under pipefail when grep exits early.
          logs=$(docker compose logs gateway)
          grep -qE 'http://localhost:8080/setup\?code=[0-9a-f]{12}' <<<"$logs"
          page=$(curl -fsS http://127.0.0.1:8080/)
          grep -q '<div id="root">' <<<"$page"
          status=$(curl -fsS http://127.0.0.1:8080/api/setup/status)
          grep -q '"configured":false' <<<"$status"
          models=$(curl -fsS http://127.0.0.1:8080/api/models)
          grep -q '"sonnet"' <<<"$models"
      - name: Icons download on first start
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:8080/api/icons || true)
            case "$body" in *'"state":"ready"'*) exit 0 ;; esac
            sleep 2
          done
          echo "$body"; exit 1
      - name: Images carry no icons
        run: |
          # Recursive over each image; the exec must succeed and find nothing. The gateway's /data
          # volume legitimately holds the downloaded cache, so it is excluded.
          pattern='\( -name "*.svg" -o -name "icons.json" -o -name "aws-*.json" \)'
          gateway=$(docker compose exec -T gateway sh -c "find / -xdev $pattern -not -path '/proc/*' -not -path '/data/*' 2>/dev/null | head -1")
          web=$(docker compose exec -T web sh -c "test -d /usr/share/nginx/html && find /usr/share/nginx/html $pattern | head -1")
          if [ -n "$gateway$web" ]; then
            echo "Icon files found in an image: $gateway $web"
            exit 1
          fi
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.build.yaml logs
      - name: Clean up
        if: always()
        run: docker compose -f compose.yaml -f compose.build.yaml down --volumes

  e2e:
    name: Browser end-to-end (${{ matrix.setup }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One entry per spec in e2e/tests/ (<setup>.spec.ts).
        setup: [claude, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Warms the buildx builder from the `containers` job's GHA cache. compose.build.yaml has
      # `pull_policy: build`, so the stack rebuilds anyway; with the same builder
      # (BUILDX_BUILDER below) that rebuild is all cache hits.
      - name: Build web image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          tags: cloudarchitect-web:local
          load: true
          cache-from: type=gha,scope=web
      - name: Build gateway image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/gateway.Dockerfile
          tags: cloudarchitect-gateway:local
          load: true
          cache-from: type=gha,scope=gateway
      - name: Browser journey (Chrome preinstalled on the runner)
        run: pnpm e2e
        env:
          E2E_SETUP: ${{ matrix.setup }}
          E2E_IMAGES: local
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
      - name: Compose logs
        if: failure() || cancelled()
        # Outside the checkout, so compose finds the project by its labels (every service,
        # fake-ai included) instead of loading compose.yaml.
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e/test-results"
          docker compose --project-name ca-e2e-${{ matrix.setup }} logs --no-color > "$GITHUB_WORKSPACE/e2e/test-results/compose.log" 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: e2e-results-${{ matrix.setup }}
          path: e2e/test-results/
          retention-days: 7
      - name: Clean up
        if: always()
        # startStack tears down on its own; this covers a cancelled or crashed run.
        run: docker compose --project-name ca-e2e-${{ matrix.setup }} down --volumes --remove-orphans
