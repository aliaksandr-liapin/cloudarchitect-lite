name: Live eval

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened, ready_for_review]
    paths:
      - packages/generator/**
      - packages/catalog/data/**
      - packages/domain/src/models.ts
      - packages/domain/src/validation.ts
      - packages/domain/src/toggles.ts
      - eval/scenarios/**
      - eval/src/harness.ts
      - eval/src/live.ts
      - eval/src/gate.ts
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated model choices (haiku, sonnet, gpt-luna, gpt-sol, gemini-flash-lite, gemini-argon)
        default: haiku
      repeats:
        description: Runs per scenario
        default: '1'
      max_usd:
        description: Spend cap in USD for the whole run (at most 2.00)
        default: '0.50'

permissions:
  contents: read

jobs:
  live-eval:
    # Pull requests run only with the `live-eval` label and not as drafts; manual dispatch always runs.
    # Adding any other label to a labelled PR must not start (and so cancel) a paid run.
    # Fork PRs never get the secret, so they skip the job instead of running without it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'live-eval') &&
      (github.event.action != 'labeled' || github.event.label.name == 'live-eval') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    # Job-level, so a run whose job is skipped (e.g. another label added) never cancels one in flight.
    concurrency:
      group: live-eval-${{ github.ref }}
      cancel-in-progress: true
    name: Live generator evaluation (spends API budget)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --gate: a requested model whose key secret is missing fails the run instead of being skipped.
      - name: Run live eval with gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELS: ${{ inputs.models || 'haiku' }}
          REPEATS: ${{ inputs.repeats || '1' }}
          MAX_USD: ${{ inputs.max_usd || '0.50' }}
        # A manual dispatch can never spend more than $2.00 in one run.
        run: |
          if ! awk -v v="$MAX_USD" 'BEGIN { exit !(v ~ /^[0-9]+(\.[0-9]+)?$/ && v + 0 <= 2.00) }'; then
            echo "::error::max_usd must be a number no greater than 2.00 (got '$MAX_USD')"
            exit 1
          fi
          pnpm eval:live --gate --models "$MODELS" --repeats "$REPEATS" --max-usd "$MAX_USD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-eval-results
          path: eval/results/live/
          if-no-files-found: ignore
