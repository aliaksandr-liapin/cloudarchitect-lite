name: Release images

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish ${{ matrix.image }} to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [web, gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
      # GitHub attestations are unavailable for private repositories on personal accounts; the
      # image still carries its BuildKit SBOM and provenance. Runs automatically once public.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  smoke:
    name: Install smoke test from published images
    needs: publish
    # The install pins the version from the tag; a manual run from a branch has no published version.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull the images with GITHUB_TOKEN while the repository is private
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install as documented, from compose.yaml only
        run: |
          mkdir "$RUNNER_TEMP/install"
          cp compose.yaml "$RUNNER_TEMP/install/"
          cd "$RUNNER_TEMP/install"
          CLOUDARCHITECT_VERSION=${GITHUB_REF_NAME#v} docker compose up --detach --wait --wait-timeout 300
      - name: Setup link is printed and the API answers through nginx
        working-directory: ${{ runner.temp }}/install
        run: |
          # Bodies are captured first: `curl | grep -q` can fail under pipefail when grep exits early.
          logs=$(docker compose logs gateway)
          grep -qE 'http://localhost:8080/setup\?code=[0-9a-f]{12}' <<<"$logs"
          page=$(curl -fsS http://127.0.0.1:8080/)
          grep -q '<div id="root">' <<<"$page"
          status=$(curl -fsS http://127.0.0.1:8080/api/setup/status)
          grep -q '"configured":false' <<<"$status"
          models=$(curl -fsS http://127.0.0.1:8080/api/models)
          grep -q '"sonnet"' <<<"$models"
      - name: Icons download on first start
        working-directory: ${{ runner.temp }}/install
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:8080/api/icons || true)
            case "$body" in *'"state":"ready"'*) exit 0 ;; esac
            sleep 2
          done
          echo "$body"; exit 1
      - name: Images carry no icons
        working-directory: ${{ runner.temp }}/install
        run: |
          # Recursive over each image; the exec must succeed and find nothing. The gateway's /data
          # volume legitimately holds the downloaded cache, so it is excluded.
          pattern='\( -name "*.svg" -o -name "icons.json" -o -name "aws-*.json" \)'
          gateway=$(docker compose exec -T gateway sh -c "find / -xdev $pattern -not -path '/proc/*' -not -path '/data/*' 2>/dev/null | head -1")
          web=$(docker compose exec -T web sh -c "test -d /usr/share/nginx/html && find /usr/share/nginx/html $pattern | head -1")
          if [ -n "$gateway$web" ]; then
            echo "Icon files found in an image: $gateway $web"
            exit 1
          fi
      - name: Logs on failure
        if: failure()
        working-directory: ${{ runner.temp }}/install
        run: docker compose logs
      - name: Clean up
        if: always()
        working-directory: ${{ runner.temp }}/install
        run: docker compose down --volumes
