name: Release images

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Only run the browser end-to-end test against these published images (for example 0.4.0); nothing is published'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish ${{ matrix.image }} to GHCR
    # A manual run with `version` only tests already published images.
    if: github.event_name == 'push' || inputs.version == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [web, gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
      # GitHub attestations are unavailable for private repositories on personal accounts; the
      # image still carries its BuildKit SBOM and provenance. Runs automatically once public.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  smoke:
    name: Install smoke test from published images
    needs: publish
    # The install pins the version from the tag; a manual run from a branch has no published version.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull the images with GITHUB_TOKEN while the repository is private
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install as documented, from compose.yaml only
        run: |
          mkdir "$RUNNER_TEMP/install"
          cp compose.yaml "$RUNNER_TEMP/install/"
          cd "$RUNNER_TEMP/install"
          CLOUDARCHITECT_VERSION=${GITHUB_REF_NAME#v} docker compose up --detach --wait --wait-timeout 300
      - name: Setup link is printed and the API answers through nginx
        working-directory: ${{ runner.temp }}/install
        run: |
          # Bodies are captured first: `curl | grep -q` can fail under pipefail when grep exits early.
          logs=$(docker compose logs gateway)
          grep -qE 'http://localhost:8080/setup\?code=[0-9a-f]{12}' <<<"$logs"
          page=$(curl -fsS http://127.0.0.1:8080/)
          grep -q '<div id="root">' <<<"$page"
          status=$(curl -fsS http://127.0.0.1:8080/api/setup/status)
          grep -q '"configured":false' <<<"$status"
          models=$(curl -fsS http://127.0.0.1:8080/api/models)
          grep -q '"sonnet"' <<<"$models"
      - name: Icons download on first start
        working-directory: ${{ runner.temp }}/install
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:8080/api/icons || true)
            case "$body" in *'"state":"ready"'*) exit 0 ;; esac
            sleep 2
          done
          echo "$body"; exit 1
      - name: Images carry no icons
        working-directory: ${{ runner.temp }}/install
        run: |
          # Recursive over each image; the exec must succeed and find nothing. The gateway's /data
          # volume legitimately holds the downloaded cache, so it is excluded.
          pattern='\( -name "*.svg" -o -name "icons.json" -o -name "aws-*.json" \)'
          gateway=$(docker compose exec -T gateway sh -c "find / -xdev $pattern -not -path '/proc/*' -not -path '/data/*' 2>/dev/null | head -1")
          web=$(docker compose exec -T web sh -c "test -d /usr/share/nginx/html && find /usr/share/nginx/html $pattern | head -1")
          if [ -n "$gateway$web" ]; then
            echo "Icon files found in an image: $gateway $web"
            exit 1
          fi
      - name: Logs on failure
        if: failure()
        working-directory: ${{ runner.temp }}/install
        run: docker compose logs
      - name: Clean up
        if: always()
        working-directory: ${{ runner.temp }}/install
        run: docker compose down --volumes

  e2e:
    name: Browser end-to-end (${{ matrix.setup }})
    needs: publish
    # After a tag's publish, or on a manual run with `version` (publish is then skipped, so the
    # result check replaces the default `success()` condition).
    if: >-
      !cancelled() && (
        (startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.version != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the images with GITHUB_TOKEN while the repository is private
    strategy:
      fail-fast: false
      matrix:
        # One entry per spec in e2e/tests/ (<setup>.spec.ts).
        setup: [claude, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Browser journey against the published images
        env:
          E2E_SETUP: ${{ matrix.setup }}
          E2E_IMAGES: ghcr
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          export E2E_VERSION="${version#v}"
          echo "Testing ghcr.io/${GITHUB_REPOSITORY}/{web,gateway}:$E2E_VERSION"
          pnpm e2e
      - name: Compose logs
        if: failure() || cancelled()
        # Outside the checkout, so compose finds the project by its labels (every service,
        # fake-ai included) instead of loading compose.yaml.
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e/test-results"
          docker compose --project-name ca-e2e-${{ matrix.setup }} logs --no-color > "$GITHUB_WORKSPACE/e2e/test-results/compose.log" 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: e2e-results-${{ matrix.setup }}
          path: e2e/test-results/
          retention-days: 7
      - name: Clean up
        if: always()
        # startStack tears down on its own; this covers a cancelled or crashed run.
        run: docker compose --project-name ca-e2e-${{ matrix.setup }} down --volumes --remove-orphans
